      <button onclick="toggleRarity('rare')" id="f-rarity-rare" title="eBird Rare / Review Species: Rare vagrants requiring documentation (Black-headed Gull & Kittiwake)" class="filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-amber-300 border border-amber-500/50 hover:border-amber-400 shrink-0 transition cursor-help">&#9733; Rares Only</button>

      <span class="text-slate-700">|</span>

      <button onclick="toggleTrait('red_spot')" id="f-red_spot" title="Gonydeal Spot: Bright red spot located on the angle/expansion of the lower mandible (gonys) on adult large gulls" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Red Gonydeal Spot</button>
      <button onclick="toggleTrait('black_bill')" id="f-black_bill" title="Solid Black Bill: All-black or dark slender bill (Bonaparte's, Laughing winter, immature gulls)" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">All-Black Bill</button>

          else if (label.toLowerCase().includes('mantle') || label.toLowerCase().includes('body')) label = 'Mantle';
          else if (label.toLowerCase().includes('head') || label.toLowerCase().includes('eye')) label = 'Head/Eye';
          return `
            <div class="flex items-baseline gap-1.5 min-w-0">
              <span class="text-[10px] font-black uppercase tracking-wider text-sky-400 bg-sky-950/60 px-1 py-0.5 rounded border border-sky-800/40 shrink-0">${label}</span>
              <span class="text-slate-300 text-[11px] truncate" title="${diag.mark}">${diag.mark}</span>
            </div>
          `;
        }).join('');

        // Age Badge color & label
        let ageBadgeClass = "bg-sky-950/80 text-sky-400 border-sky-800/60";
        let ageLabel = "Adult (Definitive)";
        if (g.age === 'immature') {
          ageBadgeClass = "bg-amber-950/80 text-amber-400 border-amber-800/60";
          ageLabel = "1st-Winter (Immature)";
        }

        // Frequency / Rarity Badge
        let frequencyBadge = '';
        let rarityCallout = '';
        if (isRare) {
          frequencyBadge = `
            <span class="text-[11px] font-black px-2 py-0.5 rounded border border-amber-500/80 bg-amber-500/20 text-amber-300 uppercase tracking-wider flex items-center gap-1.5 shadow-sm">
              <span class="bg-amber-400 text-slate-950 font-black px-1 rounded-[2px] text-[10px]">R</span>
              Rare Vagrant
            </span>
          `;
          rarityCallout = `
            <div class="mt-2 text-[11px] text-amber-200/90 bg-amber-950/30 border border-amber-500/40 rounded p-2 flex items-center justify-between flex-wrap gap-2">
              <span><strong class="text-amber-300 font-bold">eBird Review Species:</strong> Rare pelagic / coastal vagrant in Mid-Atlantic & Maryland. Detailed description/photo required.</span>
              <span class="text-amber-400 font-mono text-[10px] font-bold">&lt;0.1% eBird freq</span>
            </div>
          `;
        } else if (isUncommon) {
          frequencyBadge = `
            <span class="text-[11px] font-semibold tabular-nums text-slate-300 bg-slate-800 border border-slate-700 px-2 py-0.5 rounded-full" title="Relative seasonal frequency">
              ${g.prob} freq (Uncommon)
            </span>
          `;
        } else {
          frequencyBadge = `
            <span class="text-[11px] font-semibold tabular-nums text-emerald-400 bg-emerald-950/60 border border-emerald-800/50 px-2 py-0.5 rounded-full" title="Relative seasonal frequency">
              ${g.prob} freq (Common)
            </span>
          `;
        }

        // Photo toggle state (primary vs crux)
        const currentPhotoMode = photoModes[g.id] || 'primary';
        const activePhotoUrl = currentPhotoMode === 'primary' ? g.photo : g.crux_photo;
        const activePhotoCaption = currentPhotoMode === 'primary' ? g.photo_caption : g.crux_caption;

        const photoToggleHtml = `
          <div class="flex items-center gap-0.5 bg-slate-900/90 p-0.5 rounded border border-slate-700/80 shadow">
            <button onclick="toggleCardPhoto('${g.id}', 'primary')" class="px-1.5 py-0.5 rounded text-[10px] font-medium ${currentPhotoMode === 'primary' ? 'bg-slate-800 text-white font-bold shadow-sm' : 'text-slate-400 hover:text-white'}">Profile</button>
            <button onclick="toggleCardPhoto('${g.id}', 'crux')" class="px-1.5 py-0.5 rounded text-[10px] font-medium ${currentPhotoMode === 'crux' ? 'bg-slate-800 text-white font-bold shadow-sm' : 'text-slate-400 hover:text-white'}">Crux</button>
          </div>
        `;

        // Safe string escapes for lightbox modal attributes
        const safeName = g.name.replace(/'/g, "\\'");
        const safeSci = g.sci.replace(/'/g, "\\'");
        const safePlateCap = (g.plate_caption || '').replace(/'/g, "\\'");
        const safePhotoCap = (activePhotoCaption || '').replace(/'/g, "\\'");

        // Visual layout based on currentViewMode (Both = Hand-drawn Plate on Left, Field Photo on Right)
        let visualsHtml = '';
        if (currentViewMode === 'both') {
          visualsHtml = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5 mt-2.5">
              <!-- Visual 1: Hand-Drawn Field Guide Plate with Inset Badges (Click to Enlarge) -->
              <div onclick="openLightbox('${g.plate}', '${safeName}', '${safeSci}', 'DIAGNOSTIC PLATE', '${safePlateCap}')" class="relative bg-slate-950 rounded-lg border border-slate-800/90 overflow-hidden flex flex-col justify-between cursor-zoom-in group/img transition hover:border-sky-500/50 hover:shadow-lg" title="Click to view fullscreen plate">
                <div class="absolute top-1.5 left-2 right-2 flex items-center justify-between z-10 pointer-events-none">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-sky-400 bg-slate-950/80 backdrop-blur-sm px-1.5 py-0.5 rounded border border-sky-800/40">Diagnostic Plate</span>
                  <span class="text-[10px] font-mono-num text-slate-400 bg-slate-950/80 px-1.5 py-0.5 rounded border border-slate-800/60 flex items-center gap-1 opacity-80 group-hover/img:opacity-100 group-hover/img:text-sky-300 transition">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"></path></svg>
                    Enlarge
                  </span>
                </div>
                <div class="h-40 sm:h-44 md:h-48 flex items-center justify-center p-2 overflow-hidden">
                  <img src="${g.plate}" alt="${g.name} Hand-Drawn Plate" loading="lazy" class="max-h-full max-w-full object-contain transition duration-200 group-hover/img:scale-105">
                </div>
                <div class="bg-slate-950/90 border-t border-slate-800/60 px-2.5 py-1 text-[11px] text-slate-400 truncate" title="${g.plate_caption}">
                  ${g.plate_caption}
                </div>
              </div>

              <!-- Visual 2: Field Photograph (with Inset Toggle Overlay & Click to Enlarge) -->
              <div onclick="openLightbox('${activePhotoUrl}', '${safeName}', '${safeSci}', 'FIELD PHOTO (${currentPhotoMode.toUpperCase()})', '${safePhotoCap}')" class="relative bg-slate-950 rounded-lg border border-slate-800/90 overflow-hidden flex flex-col justify-between cursor-zoom-in group/img transition hover:border-emerald-500/50 hover:shadow-lg" title="Click to view fullscreen photo">
                <div class="absolute top-1.5 left-2 right-2 flex items-center justify-between z-10">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400 bg-slate-950/80 backdrop-blur-sm px-1.5 py-0.5 rounded border border-emerald-800/40 pointer-events-none">Field Photograph</span>
                  <div onclick="event.stopPropagation();" class="pointer-events-auto">
                    ${photoToggleHtml}
                  </div>
                </div>
                <div class="h-40 sm:h-44 md:h-48 flex items-center justify-center p-2 overflow-hidden">
                  <img src="${activePhotoUrl}" alt="${g.name} Field Photo" loading="lazy" class="max-h-full max-w-full object-contain transition duration-200 group-hover/img:scale-105">
                </div>
                <div class="bg-slate-950/90 border-t border-slate-800/60 px-2.5 py-1 text-[11px] text-slate-400 truncate" title="${activePhotoCaption}">
                  ${activePhotoCaption}
                </div>
              </div>
            </div>
          `;
        } else if (currentViewMode === 'plates') {
          visualsHtml = `
            <div class="mt-2.5">
              <div onclick="openLightbox('${g.plate}', '${safeName}', '${safeSci}', 'DIAGNOSTIC PLATE', '${safePlateCap}')" class="relative bg-slate-950 rounded-lg border border-slate-800/90 overflow-hidden flex flex-col justify-between cursor-zoom-in group/img transition hover:border-sky-500/50 hover:shadow-lg" title="Click to view fullscreen plate">
                <div class="absolute top-1.5 left-2 right-2 flex items-center justify-between z-10 pointer-events-none">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-sky-400 bg-slate-950/80 backdrop-blur-sm px-1.5 py-0.5 rounded border border-sky-800/40">Diagnostic Plate</span>
                  <span class="text-[10px] font-mono-num text-slate-400 bg-slate-950/80 px-1.5 py-0.5 rounded border border-slate-800/60 flex items-center gap-1 opacity-80 group-hover/img:opacity-100 group-hover/img:text-sky-300 transition">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"></path></svg>
                    Enlarge
                  </span>
                </div>
                <div class="h-48 sm:h-56 md:h-64 flex items-center justify-center p-2 overflow-hidden">
                  <img src="${g.plate}" alt="${g.name} Hand-Drawn Plate" loading="lazy" class="max-h-full max-w-full object-contain transition duration-200 group-hover/img:scale-105">
                </div>
                <div class="bg-slate-950/90 border-t border-slate-800/60 px-2.5 py-1 text-[11px] text-slate-400 truncate" title="${g.plate_caption}">
                  ${g.plate_caption}
                </div>
              </div>
            </div>
          `;
        } else if (currentViewMode === 'photos') {
          visualsHtml = `
            <div class="mt-2.5">
              <div onclick="openLightbox('${activePhotoUrl}', '${safeName}', '${safeSci}', 'FIELD PHOTO (${currentPhotoMode.toUpperCase()})', '${safePhotoCap}')" class="relative bg-slate-950 rounded-lg border border-slate-800/90 overflow-hidden flex flex-col justify-between cursor-zoom-in group/img transition hover:border-emerald-500/50 hover:shadow-lg" title="Click to view fullscreen photo">
                <div class="absolute top-1.5 left-2 right-2 flex items-center justify-between z-10">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400 bg-slate-950/80 backdrop-blur-sm px-1.5 py-0.5 rounded border border-emerald-800/40 pointer-events-none">Field Photograph</span>
                  <div onclick="event.stopPropagation();" class="pointer-events-auto">
                    ${photoToggleHtml}
                  </div>
                </div>
                <div class="h-48 sm:h-56 md:h-64 flex items-center justify-center p-2 overflow-hidden">
                  <img src="${activePhotoUrl}" alt="${g.name} Field Photo" loading="lazy" class="max-h-full max-w-full object-contain transition duration-200 group-hover/img:scale-105">
                </div>
                <div class="bg-slate-950/90 border-t border-slate-800/60 px-2.5 py-1 text-[11px] text-slate-400 truncate" title="${activePhotoCaption}">
                  ${activePhotoCaption}
                </div>
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <!-- Main Card Row (Left Height Rail + Content) -->
          <div class="flex flex-1">
            <!-- Left Vertical Height Rail (Fills based on standing height) -->
            <div class="w-2.5 bg-slate-950 border-r border-slate-800 flex flex-col justify-end shrink-0 relative" title="Standing Stature: ${g.length_cm} cm of ${maxCategoryLength} cm category max (${lenPct}%)">
              <div class="absolute inset-y-0 right-0 flex flex-col justify-between py-4 pointer-events-none opacity-30 z-10">
                <div class="w-1 h-px bg-white"></div>
                <div class="w-1.5 h-px bg-white"></div>
                <div class="w-1 h-px bg-white"></div>
                <div class="w-1.5 h-px bg-white"></div>
              </div>
              <div class="bg-gradient-to-t from-sky-500 via-sky-400 to-cyan-300 w-full rounded-t-sm shadow-[0_0_10px_rgba(56,189,248,0.4)]" style="height: ${lenPct}%;"></div>
            </div>

            <!-- Card Content Body -->
            <div class="p-3 sm:p-3.5 flex-1 min-w-0">
              <!-- Card Header -->
              <div class="flex items-center justify-between gap-2 border-b border-slate-800/60 pb-2">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="text-xs font-black text-slate-400 font-mono-num">#${g.rank}</span>
                  <h2 class="text-base sm:text-lg font-bold tracking-tight text-white truncate">${g.name}</h2>
                  <span class="text-[11px] italic font-serif text-slate-400 hidden sm:inline">${g.sci}</span>
                  <span class="text-[10px] font-semibold px-2 py-0.5 rounded border ${ageBadgeClass}">${ageLabel}</span>
                </div>
                
                <div class="flex items-center gap-1.5 shrink-0">
                  ${frequencyBadge}
                  <span class="text-[11px] font-semibold tabular-nums px-2 py-0.5 rounded-full border ${currentSort.startsWith('size') ? 'bg-sky-950/80 text-sky-300 border-sky-500/80 font-bold' : 'bg-slate-800/80 text-slate-300 border-slate-700/80'}" title="Typical Total Body Length">${g.size_display}</span>
                  <span class="text-[11px] font-semibold tabular-nums px-2 py-0.5 rounded-full border ${currentSort.startsWith('bill') ? 'bg-sky-950/80 text-sky-300 border-sky-500/80 font-bold' : 'bg-slate-800/80 text-slate-300 border-slate-700/80'}" title="Culmen / Bill Length">${g.bill_display} beak</span>
                  <span class="text-[10px] font-mono-num font-bold text-sky-400/90 bg-sky-950/90 border border-sky-800/50 px-1.5 py-0.5 rounded-full hidden sm:inline" title="Proportion of Category Maximum Stature">${lenPct}% Max</span>
                  <button onclick="dismissSpecies('${g.id}')" title="Dismiss this species (rule it out from view)" aria-label="Dismiss ${g.name}" class="p-1 rounded text-slate-500 hover:text-rose-400 hover:bg-rose-950/40 border border-transparent hover:border-rose-800/60 transition ml-0.5 cursor-pointer">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Rarity Callout for Review Species -->
              ${rarityCallout}

              <!-- Visual Plates & Photos -->
              ${visualsHtml}

              <!-- Compact Diagnostic Grid -->
              <div class="mt-2.5 pt-2 border-t border-slate-800/80 grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
                ${diagHtml}
              </div>

              <!-- Single-line Elimination Rule -->
              <div class="mt-2 text-xs text-amber-200/90 bg-amber-950/20 border-l-2 border-amber-500 rounded-r px-2.5 py-1 flex items-center justify-between">
                <span><strong class="text-amber-300 font-bold">Rule:</strong> ${g.rule_out}</span>
              </div>
            </div>
          </div>

          <!-- Bottom Horizontal Length Rail (Spans the FULL Card Width!) -->
          <div class="h-2.5 bg-slate-950 border-t border-slate-800 flex items-center relative w-full" title="Total Body Length: ${g.length_cm} cm of ${maxCategoryLength} cm category max (${lenPct}% full-width)">
            <div class="absolute inset-x-0 top-0 flex justify-between px-6 pointer-events-none opacity-30 z-10">
              <div class="h-1 w-px bg-white"></div>
              <div class="h-1.5 w-px bg-white"></div>
              <div class="h-1 w-px bg-white"></div>
              <div class="h-1.5 w-px bg-white"></div>
            </div>
            <div class="bg-gradient-to-r from-sky-500 via-sky-400 to-cyan-300 h-full rounded-r-sm shadow-[0_0_10px_rgba(56,189,248,0.4)] transition-all" style="width: ${lenPct}%;"></div>
            <span class="absolute right-2 text-[9px] font-mono-num font-bold text-slate-500 uppercase tracking-widest hidden sm:inline">${lenPct}% Category Scale</span>
          </div>
        `;

        container.appendChild(card);
      });

      // Update counter & unhide button
      const counter = document.getElementById('matchCounter');
      const unhideBtn = document.getElementById('unhideBtn');
      const unhideCount = document.getElementById('unhideCount');
      if (counter) {
        if (dismissedCards.size > 0) {
          counter.textContent = `${matches} of 19 shown (${dismissedCards.size} hidden)`;
          if (unhideBtn) {
            unhideBtn.classList.remove('hidden');
            if (unhideCount) unhideCount.textContent = dismissedCards.size;
          }
        } else {
          counter.textContent = `${matches} of 19 variants shown`;
          if (unhideBtn) unhideBtn.classList.add('hidden');
        }
      }
    }

    function updateFilterButtons() {
      // Age buttons
      const ageAll = document.getElementById('f-age-all');
      const ageAdult = document.getElementById('f-age-adult');
      const ageImm = document.getElementById('f-age-immature');

      [ageAll, ageAdult, ageImm].forEach(b => {
        b.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition";
      });

      if (activeAge === 'all') {
        ageAll.className = "filter-chip px-2.5 py-1 rounded text-xs font-semibold bg-sky-600 text-white shrink-0 transition";
        ageAll.textContent = "All 19";
        ageAdult.textContent = "Adult (Definitive)";
        ageImm.textContent = "1st-Winter (Immature)";
      } else if (activeAge === 'adult') {
        ageAdult.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
        ageAll.textContent = "Reset Age";
        ageAdult.innerHTML = "&#10003; Adult (Definitive)";
        ageImm.textContent = "1st-Winter (Immature)";
      } else if (activeAge === 'immature') {
        ageImm.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-amber-600 text-white border border-amber-400 shrink-0 transition shadow-sm ring-1 ring-amber-400/50";
        ageAll.textContent = "Reset Age";
        ageAdult.textContent = "Adult (Definitive)";
        ageImm.innerHTML = "&#10003; 1st-Winter (Immature)";
      }

      // Rarity buttons
      const rAll = document.getElementById('f-rarity-all');
      const rCommon = document.getElementById('f-rarity-common');
      const rUncommon = document.getElementById('f-rarity-uncommon');
      const rRare = document.getElementById('f-rarity-rare');

      [rAll, rCommon, rUncommon].forEach(b => {
        b.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help";
      });
      rRare.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-amber-300 border border-amber-500/50 hover:border-amber-400 shrink-0 transition cursor-help";

      if (activeRarity === 'all') {
        rAll.className = "filter-chip px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 text-white border border-slate-700 shrink-0 transition";
      } else if (activeRarity === 'common') {
        rCommon.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
      } else if (activeRarity === 'uncommon') {
        rUncommon.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
      } else if (activeRarity === 'rare') {
        rRare.className = "filter-chip px-2.5 py-1 rounded text-xs font-black bg-amber-500 text-slate-950 border border-amber-400 shrink-0 transition shadow-sm ring-1 ring-amber-400/60";
      }

      // Trait buttons
      const traitLabels = {
        'pale_mantle': 'Pale Gray Mantle',
        'dark_mantle': 'Dark Slate Mantle',
        'black_mantle': 'Jet-Black Mantle',
        'white_mantle': 'White / Frosted',
        'yellow_legs': 'Yellow Legs',
        'pink_legs': 'Pink Legs',
        'red_legs': 'Red/Orange Legs',
        'black_legs': 'Black Legs',
        'bill_ring': 'Black Bill Ring',
        'red_spot': 'Red Gonydeal Spot',
        'black_bill': 'All-Black Bill',
        'two_toned_bill': 'Two-Toned Pink/Black',
        'white_mirrors': 'White Mirrors',
        'white_wingtips': 'White / Frosted (No Black)',
        'ink_wingtips': 'Ink-Dipped (No Mirrors)',
        'white_wedge': 'White Wing Wedge',
        'black_hood': 'Black Hood',
        'ear_spot': 'Dark Ear Spot',
        'tar_collar': 'Black \'Tar Collar\''
      };

      Object.keys(traitLabels).forEach(t => {
        const btn = document.getElementById(`f-${t}`);
        if (!btn) return;
        const base = traitLabels[t];
        if (activeTraits.has(t)) {
          btn.innerHTML = `&#10003; ${base}`;
          btn.className = "filter-chip px-2 py-0.5 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
        } else {
          btn.textContent = base;
          btn.className = "filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help";
        }
      });
    }

    // Service Worker for offline PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=28').then(reg => {
          reg.update();
        }).catch(() => {});
      });
    }

    initUrlFilter();
    // Initial render
    renderFeed();
  </script>
</body>
</html>
