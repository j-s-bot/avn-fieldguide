    let activeSex = 'all'; // 'all', 'drake', 'hen'
    const activeTraits = new Set();
    let currentViewMode = 'both'; // 'both', 'profile', 'crux'

    function renderFeed() {
      const container = document.getElementById('duckFeed');
      container.innerHTML = '';

      const filtered = ducks.filter(d => {
        // Sex filter
        if (activeSex === 'drake' && d.sex !== 'drake' && d.sex !== 'both') return false;
        if (activeSex === 'hen' && d.sex !== 'hen' && d.sex !== 'both') return false;

        // Trait filters (AND logic: must match all selected traits)
        for (const trait of activeTraits) {
          if (trait === 'dabbler' && d.guild !== 'dabbler') return false;
          if (trait === 'diver' && d.guild !== 'diver') return false;
          if (trait !== 'dabbler' && trait !== 'diver' && !d.traits.includes(trait)) return false;
        }

        return true;
      });

      // Update match counter
      const counter = document.getElementById('matchCounter');
      let label = `${filtered.length} variants shown`;
      if (filtered.length === 1) {
        if (activeSex === 'drake') label = '1 drake shown';
        else if (activeSex === 'hen') label = '1 hen shown';
        else label = '1 variant shown';
      } else {
        if (activeSex === 'drake') label = `${filtered.length} drakes shown`;
        else if (activeSex === 'hen') label = `${filtered.length} hens shown`;
      }
      counter.textContent = label;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 px-4 bg-slate-900/50 border border-slate-800 rounded-xl">
            <h3 class="text-base font-semibold text-slate-200">No waterfowl match the active combination</h3>
            <p class="text-xs text-slate-400 mt-1.5">Try deselecting some traits or resetting the sex filter to view more species.</p>
            <button onclick="resetAllFilters()" class="mt-4 px-3 py-1.5 rounded-md text-xs font-semibold bg-sky-600 text-white hover:bg-sky-500 transition">
              Reset All Filters
            </button>
          </div>
        `;
        return;
      }

      filtered.forEach(d => {
        const card = document.createElement('article');
        card.id = `duck-${d.id}`;
        card.className = "bg-slate-900 border border-slate-800 rounded-xl p-3 sm:p-4 transition hover:border-slate-700/80 shadow-sm";

        // Diagnostics HTML
        const diagHtml = d.diagnostics.map(diag => `
          <div class="flex items-baseline gap-2 text-xs leading-relaxed">
            <span class="font-bold text-[11px] uppercase tracking-wider text-sky-400 shrink-0 w-24 sm:w-28">${diag.tract}</span>
            <span class="text-slate-200">${diag.mark}</span>
          </div>
        `).join('');

        // Sex Badge color & label
        let sexBadgeClass = "bg-sky-950/80 text-sky-400 border-sky-800/60";
        let sexLabel = "Drake (Male)";
        if (d.sex === 'hen') {
          sexBadgeClass = "bg-amber-950/80 text-amber-400 border-amber-800/60";
          sexLabel = "Hen (Female)";
        } else if (d.sex === 'both') {
          sexBadgeClass = "bg-slate-800 text-slate-300 border-slate-700";
          sexLabel = "Drake & Hen Similar";
        }

        // Guild badge
        const guildBadge = d.guild === 'dabbler' ? 
          '<span class="text-[11px] font-medium px-2 py-0.5 rounded bg-emerald-950/60 text-emerald-300 border border-emerald-800/40">Dabbler</span>' :
          '<span class="text-[11px] font-medium px-2 py-0.5 rounded bg-indigo-950/60 text-indigo-300 border border-indigo-800/40">Diver</span>';

        // Visual layout based on currentViewMode
        let visualsHtml = '';
        if (currentViewMode === 'both') {
          visualsHtml = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">
              <!-- Visual 1: Profile -->
              <div class="flex flex-col">
                <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 mb-1 px-1">
                  <span class="text-sky-400 uppercase tracking-wide">Lateral Profile</span>
                  <span class="text-slate-500 text-[10px]">Photo</span>
                </div>
                <div class="bg-slate-950/90 rounded-lg border border-slate-800/80 flex items-center justify-center p-1.5 h-48 sm:h-56 md:h-64">
                  <img src="${d.img1}" alt="${d.name} Lateral Profile" loading="lazy" class="max-h-full max-w-full object-contain">
                </div>
                <p class="text-[11px] text-slate-400 mt-1.5 px-1 leading-snug">${d.img1_caption}</p>
              </div>

              <!-- Visual 2: Crux / Speculum / Detail -->
              <div class="flex flex-col">
                <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 mb-1 px-1">
                  <span class="text-amber-400 uppercase tracking-wide">Diagnostic Crux / Detail</span>
                  <span class="text-slate-500 text-[10px]">Close-up</span>
                </div>
                <div class="bg-slate-950/90 rounded-lg border border-slate-800/80 flex items-center justify-center p-1.5 h-48 sm:h-56 md:h-64">
                  <img src="${d.img2}" alt="${d.name} Crux Detail" loading="lazy" class="max-h-full max-w-full object-contain">
                </div>
                <p class="text-[11px] text-slate-400 mt-1.5 px-1 leading-snug">${d.img2_caption}</p>
              </div>
            </div>
          `;
        } else if (currentViewMode === 'profile') {
          visualsHtml = `
            <div class="mt-3">
              <div class="bg-slate-950/90 rounded-lg border border-slate-800/80 flex items-center justify-center p-1.5 h-52 sm:h-64 md:h-72">
                <img src="${d.img1}" alt="${d.name} Lateral Profile" loading="lazy" class="max-h-full max-w-full object-contain">

          visualsHtml = `

              <div class="bg-slate-950/90 rounded-lg border border-slate-800/80 flex items-center justify-center p-1.5 h-52 sm:h-64 md:h-72">
                <img src="${d.img2}" alt="${d.name} Crux Detail" loading="lazy" class="max-h-full max-w-full object-contain">
              </div>
              <p class="text-[11px] text-slate-400 mt-1.5 px-1 leading-snug">${d.img2_caption}</p>
            </div>
          `;
        }

        card.innerHTML = `

          <div class="flex items-start justify-between gap-2 border-b border-slate-800/60 pb-2.5">
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-black text-slate-400 tabular-nums">#${d.rank}</span>
                <h2 class="text-lg sm:text-xl font-bold tracking-tight text-white">${d.name}</h2>
                <span class="text-[11px] font-semibold px-2 py-0.5 rounded border ${sexBadgeClass}">${sexLabel}</span>
                ${guildBadge}
              </div>
              <p class="text-xs italic font-serif text-slate-400 mt-0.5">${d.sci}</p>
            </div>
            
            <div class="flex items-center gap-1.5 shrink-0">
              <span class="text-[11px] font-semibold tabular-nums text-emerald-400 bg-emerald-950/60 border border-emerald-800/50 px-2 py-0.5 rounded-full" title="Relative seasonal frequency in Central MD late fall">

          ${visualsHtml}

          <!-- Diagnostic Feather Tract Checklist -->
          <div class="mt-3 pt-2.5 border-t border-slate-800/80 space-y-1">
            ${diagHtml}
          </div>

          <!-- Single-line Elimination Rule -->
          <div class="mt-2.5 text-xs text-amber-200/90 bg-amber-950/20 border border-amber-800/30 rounded-md p-2">
            <strong class="text-amber-300 font-bold">Rule:</strong> ${d.rule_out}

        container.appendChild(card);

    function toggleSex(sex) {
      if (activeSex === sex) {
        activeSex = 'all'; // toggle back to all if clicked again
      } else {
        activeSex = sex;
      }
      updateFilterButtons();
      renderFeed();
    }

    function toggleTrait(trait) {
      // Handle mutually exclusive guild filters
      if (trait === 'dabbler') {
        activeTraits.delete('diver');
      } else if (trait === 'diver') {
        activeTraits.delete('dabbler');
      }

      if (activeTraits.has(trait)) {
        activeTraits.delete(trait);
      } else {
        activeTraits.add(trait);
      }
      updateFilterButtons();
      renderFeed();
    }

    function resetAllFilters() {
      activeSex = 'all';
      activeTraits.clear();
      updateFilterButtons();
      renderFeed();
    }

      // Sex buttons
      const sexAll = document.getElementById('f-sex-all');
      const sexDrake = document.getElementById('f-sex-drake');
      const sexHen = document.getElementById('f-sex-hen');

      if (activeSex === 'all') {
        sexAll.className = "filter-chip px-2.5 py-1 rounded text-xs font-semibold bg-sky-600 text-white shrink-0 transition";
        sexDrake.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition";
        sexHen.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition";
        sexAll.textContent = "All 25";
        sexDrake.textContent = "Drake (Male)";
        sexHen.textContent = "Hen (Female)";
      } else if (activeSex === 'drake') {
        sexAll.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition";
        sexDrake.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
        sexHen.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition";
        sexAll.textContent = "Reset Sex";
        sexDrake.innerHTML = "&#10003; Drake (Male)";
        sexHen.textContent = "Hen (Female)";
      } else if (activeSex === 'hen') {
        sexAll.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition";
        sexDrake.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition";
        sexHen.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-amber-600 text-white border border-amber-400 shrink-0 transition shadow-sm ring-1 ring-amber-400/50";
        sexAll.textContent = "Reset Sex";
        sexDrake.textContent = "Drake (Male)";
        sexHen.innerHTML = "&#10003; Hen (Female)";
      }

      // Trait buttons
      const traitLabels = {
        'dabbler': 'Dabbler',
        'diver': 'Diver',
        'spatulate_bill': 'Spatulate Bill',
        'white_bill_ring': 'White Bill Ring',
        'crested_head': 'Crested Head',
        'green_head': 'Green Head/Patch',
        'white_cheek_patch': 'White Cheek Patch',
        'white_speculum': 'White Speculum',
        'stiff_tail': 'Stiff Tail',
        'white_bill_base': 'White at Bill Base'
      };

      Object.keys(traitLabels).forEach(t => {
        const btn = document.getElementById(`f-${t}`);
        if (!btn) return;
        const base = traitLabels[t];
        if (activeTraits.has(t)) {
          btn.innerHTML = `&#10003; ${base}`;
          btn.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
        } else {
          btn.textContent = base;
          btn.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help";
        }
      });
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      document.querySelectorAll('.view-btn').forEach(b => {
        b.className = "view-btn px-2 py-0.5 rounded text-[11px] font-medium text-slate-400 hover:text-white";
      });
      const active = document.getElementById(`vm-${mode}`);
      if (active) active.className = "view-btn px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-800 text-white";
      renderFeed();
    }

    // Service Worker for offline PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=6').then(reg => {
          reg.update();
        }).catch(() => {});
      });
    }

    // Initial render
    renderFeed();
  </script>
</body>
</html>
