<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Swans & Lookalikes Guide | AVN Fieldguide</title>
  <script>
    const incoming = new URLSearchParams(window.location.search);
    const params = new URLSearchParams();
    params.set('guide', 'swans');
    incoming.forEach((val, key) => {
      if (key !== 'guide') params.append(key, val);
    });
    const hash = window.location.hash || '';
    window.location.replace('index.html?' + params.toString() + hash);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=index.html?guide=swans">
  </noscript>
</head>
<body style="background:#060913;color:#94a3b8;font-family:system-ui,-apple-system,sans-serif;padding:3rem 1.5rem;text-align:center;">
  <p>Redirecting to <a href="index.html?guide=swans" style="color:#38bdf8;font-weight:bold;">Swans & Lookalikes Guide</a>...</p>
</body>
</html>
