    function dismissSpecies(id) {
      dismissedCards.add(id);
      renderFeed();
    }

    function unhideAll() {
      dismissedCards.clear();
      renderFeed();
    }

    function toggleGroup(group) {
      activeGroup = group;
      renderFeed();
    }

    function toggleRarity(rarity) {
      activeRarity = rarity;
      renderFeed();
    }

    function toggleTrait(trait) {
      if (activeTraits.has(trait)) {
        activeTraits.delete(trait);
      } else {
        if (traitExclusions[trait]) {
          traitExclusions[trait].forEach(t => activeTraits.delete(t));
        }
        activeTraits.add(trait);
      }
      renderFeed();
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      ['both', 'plates', 'photos'].forEach(m => {
        const b = document.getElementById(`vm-${m}`);
        if (b) b.className = "view-btn px-2 py-0.5 rounded text-[11px] font-medium text-slate-400 hover:text-white";
      });
      const active = document.getElementById(`vm-${mode}`);
      if (active) active.className = "view-btn px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-800 text-white";
      renderFeed();
    }

    function toggleCardPhoto(speciesId, mode) {
      photoModes[speciesId] = mode;
      renderFeed();
    }

    function renderFeed() {
      const container = document.getElementById('ternFeed');
      if (!container) return;
      container.innerHTML = '';

      updateFilterButtons();

      let matches = 0;

      terns.forEach(t => {
        if (dismissedCards.has(t.id)) return;

        // Group filter
        if (activeGroup !== 'all' && t.group !== activeGroup) {
          return;
        }

        // Rarity filter
        if (activeRarity !== 'all' && t.rarity !== activeRarity) {
          return;
        }

        // Trait filters (AND logic across all active facets)
        for (const trait of activeTraits) {
          if (!t.traits.includes(trait)) {
            return;
          }
        }

        matches++;

        // Determine current photo for this card (primary vs crux)
        const currentPhotoMode = photoModes[t.id] || 'primary';
        const activePhotoUrl = currentPhotoMode === 'crux' ? t.crux_photo : t.photo;
        const activePhotoCaption = currentPhotoMode === 'crux' ? t.crux_caption : t.photo_caption;

        const card = document.createElement('div');
        card.id = `sp-${t.id}`;
        card.className = "bg-slate-900/90 border border-slate-800 rounded-xl p-3.5 sm:p-4 shadow-lg transition-all duration-200";

        // Frequency & Rarity Badge
        let frequencyBadge = '';
        let rarityCallout = '';
        if (t.rarity === 'rare') {
          frequencyBadge = `<span class="text-xs font-black px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 tracking-wide uppercase">&#9733; eBird Rare</span>`;
          rarityCallout = `
            <div class="mt-2.5 p-2 rounded-lg bg-amber-950/30 border border-amber-500/30 flex items-start gap-2 text-xs text-amber-200/90">
              <span class="text-amber-400 font-bold shrink-0">&#9888; Review / Pelagic Vagrant:</span>
              <span>Requires field notes, photos, and formal documentation for local eBird review. Check underwing translucency, bill proportions, and tail streamers.</span>
            </div>
          `;
        } else if (t.rarity === 'uncommon') {
          frequencyBadge = `<span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-950/80 text-indigo-300 border border-indigo-800/80">${t.prob} Seasonal</span>`;
        } else {
          frequencyBadge = `<span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-sky-300 border border-slate-700">${t.prob} Frequency</span>`;
        }

        // Guild Tag formatting
        const groupLabels = {
          'typical_sterna': 'Typical Sterna',
          'crested_tern': 'Crested Tern',
          'marsh_tern': 'Marsh Tern',
          'small_tern': 'Small Tern',
          'skimmer': 'Skimmer',
          'pelagic_vagrant': 'Pelagic Vagrant'
        };
        const groupLabel = groupLabels[t.group] || t.group;

        // Diagnostics list HTML
        let diagHtml = '';
        t.diagnostics.forEach(d => {
          diagHtml += `
            <div class="flex items-baseline gap-1.5 text-xs text-slate-300">
              <span class="font-bold text-sky-400 shrink-0">${d.tract}:</span>
              <span class="leading-relaxed">${d.mark}</span>
            </div>
          `;
        });

        const photoToggleHtml = `
          <div class="flex items-center gap-1 mt-1.5 justify-end">
            <button onclick="toggleCardPhoto('${t.id}', 'primary')" class="px-2 py-0.5 rounded text-[10px] font-medium ${currentPhotoMode === 'primary' ? 'bg-slate-800 text-white font-bold' : 'text-slate-400 hover:text-white'}">Profile Photo</button>
            <button onclick="toggleCardPhoto('${t.id}', 'crux')" class="px-2 py-0.5 rounded text-[10px] font-medium ${currentPhotoMode === 'crux' ? 'bg-slate-800 text-white font-bold' : 'text-slate-400 hover:text-white'}">Crux Detail</button>
          </div>
        `;

        // Visual layout based on currentViewMode (Both = Hand-drawn Plate on Left, Field Photo on Right)
        let visualsHtml = '';
        if (currentViewMode === 'both') {
          visualsHtml = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">
              <!-- Visual 1: Hand-Drawn Field Guide Plate -->
              <div class="flex flex-col">
                <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 mb-1 px-1">
                  <span class="text-sky-400 uppercase tracking-wide">Standardized Scientific Plate</span>
                  <span class="text-slate-500 text-[10px]">Sibley Style Watercolor</span>
                </div>
                <div class="bg-slate-950/90 rounded-lg border border-slate-800/80 flex items-center justify-center p-1.5 h-48 sm:h-56 md:h-64">
                  <img src="${t.plate}" alt="${t.name} Hand-Drawn Plate" loading="lazy" class="max-h-full max-w-full object-contain">
                </div>
                <p class="text-[11px] text-slate-400 mt-1.5 px-1 leading-snug">${t.plate_caption}</p>
              </div>

              <!-- Visual 2: Field Photograph (with Toggle) -->
              <div class="flex flex-col">
                <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 mb-1 px-1">
                  <span class="text-emerald-400 uppercase tracking-wide">Field Photograph</span>
                  <span class="text-slate-500 text-[10px]">Natural Habitat</span>
                </div>
                <div class="bg-slate-950/90 rounded-lg border border-slate-800/80 flex items-center justify-center p-1.5 h-48 sm:h-56 md:h-64">
                  <img src="${activePhotoUrl}" alt="${t.name} Field Photo" loading="lazy" class="max-h-full max-w-full object-contain">
                </div>
                <div class="flex items-start justify-between gap-1 px-1 mt-1.5">
                  <p class="text-[11px] text-slate-400 leading-snug">${activePhotoCaption}</p>
                  ${photoToggleHtml}
                </div>
              </div>
            </div>
          `;
        } else if (currentViewMode === 'plates') {
          visualsHtml = `
            <div class="mt-3">
              <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 mb-1 px-1">
                <span class="text-sky-400 uppercase tracking-wide">Standardized Scientific Plate</span>
                <span class="text-slate-500 text-[10px]">Sibley Style Watercolor</span>
              </div>
              <div class="bg-slate-950/90 rounded-lg border border-slate-800/80 flex items-center justify-center p-1.5 h-52 sm:h-64 md:h-72">
                <img src="${t.plate}" alt="${t.name} Hand-Drawn Plate" loading="lazy" class="max-h-full max-w-full object-contain">
              </div>
              <p class="text-[11px] text-slate-400 mt-1.5 px-1 leading-snug">${t.plate_caption}</p>
            </div>
          `;
        } else if (currentViewMode === 'photos') {
          visualsHtml = `
            <div class="mt-3">
              <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 mb-1 px-1">
                <span class="text-emerald-400 uppercase tracking-wide">Field Photograph</span>
                ${photoToggleHtml}
              </div>
              <div class="bg-slate-950/90 rounded-lg border border-slate-800/80 flex items-center justify-center p-1.5 h-52 sm:h-64 md:h-72">
                <img src="${activePhotoUrl}" alt="${t.name} Field Photo" loading="lazy" class="max-h-full max-w-full object-contain">
              </div>
              <p class="text-[11px] text-slate-400 mt-1.5 px-1 leading-snug">${activePhotoCaption}</p>
            </div>
          `;
        }

        card.innerHTML = `
          <!-- Card Header -->
          <div class="flex items-start justify-between gap-2 border-b border-slate-800/60 pb-2.5">
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-black text-slate-400 tabular-nums">#${t.rank}</span>
                <h2 class="text-lg sm:text-xl font-bold tracking-tight text-white">${t.name}</h2>
                <span class="text-[11px] font-semibold px-2 py-0.5 rounded border bg-sky-950/80 text-sky-400 border-sky-800/60">${groupLabel}</span>
              </div>
              <p class="text-xs italic font-serif text-slate-400 mt-0.5">${t.sci}</p>
            </div>
            
            <div class="flex items-center gap-1.5 shrink-0">
              ${frequencyBadge}
              <button onclick="dismissSpecies('${t.id}')" title="Dismiss this species (rule it out from view)" aria-label="Dismiss ${t.name}" class="p-1 rounded text-slate-500 hover:text-rose-400 hover:bg-rose-950/40 border border-transparent hover:border-rose-800/60 transition ml-1 cursor-pointer">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Rarity Callout for Review Species -->
          ${rarityCallout}

          <!-- Visual Plates & Photos -->
          ${visualsHtml}

          <!-- Diagnostic Feather Tract Checklist -->
          <div class="mt-3 pt-2.5 border-t border-slate-800/80 space-y-1">
            ${diagHtml}
          </div>

          <!-- Single-line Elimination Rule -->
          <div class="mt-2.5 text-xs text-amber-200/90 bg-amber-950/20 border border-amber-800/30 rounded-md p-2">
            <strong class="text-amber-300 font-bold">Rule:</strong> ${t.rule_out}
          </div>
        `;

        container.appendChild(card);
      });

      // Update counter & unhide button
      const counter = document.getElementById('matchCounter');
      const unhideBtn = document.getElementById('unhideBtn');
      const unhideCount = document.getElementById('unhideCount');
      if (counter) {
        if (dismissedCards.size > 0) {
          counter.textContent = `${matches} of ${terns.length} shown (${dismissedCards.size} hidden)`;
          if (unhideBtn) {
            unhideBtn.classList.remove('hidden');
            if (unhideCount) unhideCount.textContent = dismissedCards.size;
          }
        } else {
          counter.textContent = `${matches} of ${terns.length} variants shown`;
          if (unhideBtn) unhideBtn.classList.add('hidden');
        }
      }
    }

    function updateFilterButtons() {
      // Group buttons
      const groupIds = ['all', 'typical_sterna', 'crested_tern', 'marsh_tern', 'small_tern', 'skimmer', 'pelagic_vagrant'];
      groupIds.forEach(g => {
        const btn = document.getElementById(`f-group-${g}`);
        if (!btn) return;
        if (activeGroup === g) {
          btn.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
        } else {
          btn.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help";
        }
      });

      // Rarity buttons
      const rAll = document.getElementById('f-rarity-all');
      const rCommon = document.getElementById('f-rarity-common');
      const rUncommon = document.getElementById('f-rarity-uncommon');
      const rRare = document.getElementById('f-rarity-rare');

      [rAll, rCommon, rUncommon].forEach(b => {
        if (b) b.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help";
      });
      if (rRare) rRare.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-amber-300 border border-amber-500/50 hover:border-amber-400 shrink-0 transition cursor-help";

      if (activeRarity === 'all') {
        if (rAll) rAll.className = "filter-chip px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 text-white border border-slate-700 shrink-0 transition";
      } else if (activeRarity === 'common') {
        if (rCommon) rCommon.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
      } else if (activeRarity === 'uncommon') {
        if (rUncommon) rUncommon.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
      } else if (activeRarity === 'rare') {
        if (rRare) rRare.className = "filter-chip px-2.5 py-1 rounded text-xs font-black bg-amber-500 text-slate-950 border border-amber-400 shrink-0 transition shadow-sm ring-1 ring-amber-400/60";
      }

      // Trait buttons
      const traitLabels = {
        'orange_black_bill': 'Orange/Red + Black Tip',
        'all_black_bill': 'All-Black Bill',
        'carrot_orange_bill': 'Carrot-Orange Bill',
        'blood_red_bill': 'Blood-Red Bill',
        'yellow_black_bill': 'Yellow + Black Tip',
        'yellow_tip_bill': 'Yellow-Tipped Black Bill',
        'knife_bill': 'Knife Bill',
        'thick_black_bill': 'Thick Gull-Like Bill',
        'isolated_eye_mask': 'Isolated \'Comma\' Mask',
        'dark_nape_band': 'Full Nape Band',
        'white_forehead': 'White Forehead',
        'white_triangle': 'White Triangle',
        'shaggy_crest': 'Shaggy Crest',
        'white_collar': 'White Nape Collar',
        'pale_primaries': 'Frosty Pale Primaries',
        'dark_primaries': 'Dark Primary Wedge',
        'carpal_bar': 'Dark Carpal Bar',
        'dark_underwing_wedge': 'Black Underwing Patch',
        'long_streamers': 'Long Tail Streamers',
        'breast_smudge': 'Breast Smudge',
        'black_body': 'Black Body / Back',
        'orange_red_legs': 'Orange/Red Legs',
        'yellow_legs': 'Yellow Legs',
        'black_legs': 'Black Legs',
        'short_legs': 'Very Short Legs'
      };

      Object.keys(traitLabels).forEach(t => {
        const btn = document.getElementById(`f-${t}`);
        if (!btn) return;
        const base = traitLabels[t];
        if (activeTraits.has(t)) {
          btn.innerHTML = `&#10003; ${base}`;
          btn.className = "filter-chip px-2 py-0.5 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
        } else {
          btn.textContent = base;
          btn.className = "filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help";
        }
      });
    }

    // Service Worker for offline PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=12').then(reg => {
          reg.update();
        }).catch(() => {});
      });
    }

    // Initial render
    renderFeed();
  </script>
</body>
</html>
