        "mark": "Diagnostic stark black bar or half-collar across the hindneck ('tar collar'), accompanied by a crisp black ear spot."
      },
      {
        "tract": "Wing Pattern",
        "mark": "Bold, dramatic black diagonal 'M' or zigzag band across upperwing coverts contrasting with pure white trailing secondary triangle."
      },
      {
        "tract": "Bill & Legs",
        "mark": "Stout, all-black bill; short jet-black legs; neat black terminal band on notched white tail."
      }
    ],
    "rule_out": "Black 'tar collar' on nape + bold black 'M' zigzag on upperwing + solid black bill + short black legs = 1st-Winter Black-legged Kittiwake.",
    "rarity": "rare"
  }
];

    let activeAge = 'all'; // 'all', 'adult', 'immature'
    let activeRarity = 'all'; // 'all', 'common', 'uncommon', 'rare'
    let activeTraits = new Set();
    let currentViewMode = 'both'; // 'both', 'plates', 'photos'

    // Mutually exclusive trait pairings
    const EXCLUSIVE_PAIRS = [
      ['pale_mantle', 'dark_mantle'],
      ['pale_mantle', 'black_mantle'],
      ['pale_mantle', 'white_mantle'],
      ['dark_mantle', 'black_mantle'],
      ['dark_mantle', 'white_mantle'],
      ['black_mantle', 'white_mantle'],
      ['yellow_legs', 'pink_legs'],
      ['yellow_legs', 'red_legs'],
      ['yellow_legs', 'black_legs'],
      ['pink_legs', 'red_legs'],
      ['pink_legs', 'black_legs'],
      ['red_legs', 'black_legs'],
      ['bill_ring', 'red_spot'],
      ['bill_ring', 'black_bill'],
      ['bill_ring', 'two_toned_bill'],
      ['red_spot', 'black_bill'],
      ['red_spot', 'two_toned_bill'],
      ['black_hood', 'ear_spot'],
      ['black_hood', 'tar_collar']
    ];

    function toggleAge(age) {
      activeAge = age;
      renderFeed();
    }

    function toggleRarity(rarity) {
      activeRarity = rarity;
      renderFeed();
    }

    function toggleTrait(trait) {
      if (activeTraits.has(trait)) {
        activeTraits.delete(trait);
      } else {
        // Remove mutually exclusive traits
        EXCLUSIVE_PAIRS.forEach(pair => {
          if (pair[0] === trait && activeTraits.has(pair[1])) activeTraits.delete(pair[1]);
          if (pair[1] === trait && activeTraits.has(pair[0])) activeTraits.delete(pair[0]);
        });
        activeTraits.add(trait);
      }
      renderFeed();
    }

    function renderFeed() {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      let matches = 0;

      GULLS.forEach(g => {
        // Filter by Age
        if (activeAge !== 'all' && g.age !== activeAge) return;

        // Filter by eBird Rarity
        if (activeRarity !== 'all' && g.rarity !== activeRarity) return;

        // Filter by Trait (AND condition)
        for (const t of activeTraits) {
          if (!g.traits.includes(t)) return;
        }

        matches++;

        const card = document.createElement('div');
        const isRare = g.rarity === 'rare';
        const isUncommon = g.rarity === 'uncommon';

        const borderClass = isRare 
          ? "border-amber-500/70 rare-card bg-gradient-to-b from-slate-900/90 to-amber-950/20" 
          : (isUncommon ? "border-slate-700/80 bg-slate-900/70" : "border-slate-800/80 bg-slate-900/40");

        card.className = `card-transition rounded-xl border ${borderClass} p-4 flex flex-col justify-between overflow-hidden relative`;

        // Image Section based on currentViewMode
        let imageHtml = '';
        if (currentViewMode === 'both') {
          imageHtml = `
            <div class="grid grid-cols-2 gap-2 mb-3">
              <div class="relative group cursor-pointer overflow-hidden rounded-lg border border-slate-800 bg-slate-950/60 aspect-[4/3] flex items-center justify-center" onclick="openModal('${g.plate}', '${g.plate_caption}')">
                <img src="${g.plate}" alt="${g.name} plate" class="w-full h-full object-contain p-1 group-hover:scale-105 transition duration-200">
                <span class="absolute bottom-1 left-1.5 px-1.5 py-0.5 rounded text-[9px] font-bold bg-slate-950/80 text-sky-400 border border-sky-500/30 uppercase tracking-wider backdrop-blur-sm">Plate</span>
              </div>
              <div class="relative group cursor-pointer overflow-hidden rounded-lg border border-slate-800 bg-slate-950/60 aspect-[4/3] flex items-center justify-center" onclick="openModal('${g.photo}', '${g.photo_caption}')">
                <img src="${g.photo}" alt="${g.name} field photo" class="w-full h-full object-cover group-hover:scale-105 transition duration-200">
                <span class="absolute bottom-1 left-1.5 px-1.5 py-0.5 rounded text-[9px] font-bold bg-slate-950/80 text-emerald-400 border border-emerald-500/30 uppercase tracking-wider backdrop-blur-sm">Field</span>
              </div>
            </div>
          `;
        } else if (currentViewMode === 'plates') {
          imageHtml = `
            <div class="mb-3">
              <div class="relative group cursor-pointer overflow-hidden rounded-lg border border-slate-800 bg-slate-950/60 aspect-[16/10] flex items-center justify-center" onclick="openModal('${g.plate}', '${g.plate_caption}')">
                <img src="${g.plate}" alt="${g.name} plate" class="w-full h-full object-contain p-2 group-hover:scale-105 transition duration-200">
                <span class="absolute bottom-1.5 left-2 px-1.5 py-0.5 rounded text-[10px] font-bold bg-slate-950/80 text-sky-400 border border-sky-500/30 uppercase tracking-wider backdrop-blur-sm">Scientific Plate</span>
              </div>
            </div>
          `;
        } else if (currentViewMode === 'photos') {
          imageHtml = `
            <div class="grid grid-cols-2 gap-2 mb-3">
              <div class="relative group cursor-pointer overflow-hidden rounded-lg border border-slate-800 bg-slate-950/60 aspect-[4/3] flex items-center justify-center" onclick="openModal('${g.photo}', '${g.photo_caption}')">
                <img src="${g.photo}" alt="${g.name} field photo 1" class="w-full h-full object-cover group-hover:scale-105 transition duration-200">
                <span class="absolute bottom-1 left-1.5 px-1.5 py-0.5 rounded text-[9px] font-bold bg-slate-950/80 text-emerald-400 border border-emerald-500/30 uppercase tracking-wider backdrop-blur-sm">Profile</span>
              </div>
              <div class="relative group cursor-pointer overflow-hidden rounded-lg border border-slate-800 bg-slate-950/60 aspect-[4/3] flex items-center justify-center" onclick="openModal('${g.crux_photo}', '${g.crux_caption}')">
                <img src="${g.crux_photo}" alt="${g.name} field photo 2" class="w-full h-full object-cover group-hover:scale-105 transition duration-200">
                <span class="absolute bottom-1 left-1.5 px-1.5 py-0.5 rounded text-[9px] font-bold bg-slate-950/80 text-amber-400 border border-amber-500/30 uppercase tracking-wider backdrop-blur-sm">Crux View</span>
              </div>
            </div>
          `;
        }

        // Diagnostics list
        const diagList = g.diagnostics.map(d => `
          <div class="text-xs mb-1.5">
            <span class="font-bold text-slate-300">${d.tract}:</span>
            <span class="text-slate-400 leading-relaxed">${d.mark}</span>
          </div>
        `).join('');

        // Rarity Badge Markup
        let rarityBadge = '';
        if (isRare) {
          rarityBadge = `<span class="rare-badge px-2 py-0.5 rounded text-[10px] font-black text-slate-950 uppercase tracking-wider shrink-0">[R] Rare Vagrant</span>`;
        } else if (isUncommon) {
          rarityBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-800 text-slate-300 border border-slate-700 shrink-0">Uncommon</span>`;
        } else {
          rarityBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-950/60 text-emerald-300 border border-emerald-800/50 shrink-0">Common</span>`;
        }

        card.innerHTML = `
          <div>
            <!-- Header row: Rank, Name, Badges -->
            <div class="flex items-start justify-between gap-2 mb-1.5">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="text-xs font-mono font-bold text-slate-500">#${g.rank}</span>
                  <h3 class="text-sm font-bold text-white tracking-tight leading-snug">${g.name}</h3>
                </div>
                <div class="text-[11px] text-slate-400 italic">${g.sci}</div>
              </div>
              <div class="flex flex-col items-end gap-1">
                ${rarityBadge}
                <span class="text-[10px] font-mono text-slate-500 tabular-nums">freq ~${g.prob}</span>
              </div>
            </div>

            <!-- Media Section -->
            ${imageHtml}

            <!-- Diagnostics -->
            <div class="space-y-1 mb-3 pt-1 border-t border-slate-800/80">
              ${diagList}
            </div>
          </div>

          <!-- Bottom Crux Box -->
          <div class="mt-2 pt-2 border-t border-slate-800/60 text-[11px] bg-slate-950/50 p-2 rounded border border-slate-800/50">
            <span class="font-bold text-sky-400 uppercase text-[9px] tracking-wider block mb-0.5">Disambiguation Crux:</span>
            <p class="text-slate-300 leading-snug font-medium">${g.rule_out}</p>
          </div>
        `;

        grid.appendChild(card);
      });

      // Update counter
      document.getElementById('matchCounter').textContent = `${matches} of 19 variants shown`;
      updateFilterButtonsUI();
    }

    function updateFilterButtonsUI() {
      // Age buttons
      const ageAll = document.getElementById('f-age-all');
      const ageAdult = document.getElementById('f-age-adult');
      const ageImm = document.getElementById('f-age-immature');

      [ageAll, ageAdult, ageImm].forEach(b => {
        b.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition";
      });

      if (activeAge === 'all') {
        ageAll.className = "filter-chip px-2.5 py-1 rounded text-xs font-semibold bg-sky-600 text-white shrink-0 transition";
        ageAll.textContent = "All 19";
        ageAdult.textContent = "Adult (Definitive)";
        ageImm.textContent = "1st-Winter (Immature)";
      } else if (activeAge === 'adult') {
        ageAdult.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
        ageAll.textContent = "Reset Age";
        ageAdult.innerHTML = "&#10003; Adult (Definitive)";
        ageImm.textContent = "1st-Winter (Immature)";
      } else if (activeAge === 'immature') {
        ageImm.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-amber-600 text-white border border-amber-400 shrink-0 transition shadow-sm ring-1 ring-amber-400/50";
        ageAll.textContent = "Reset Age";
        ageAdult.textContent = "Adult (Definitive)";
        ageImm.innerHTML = "&#10003; 1st-Winter (Immature)";
      }

      // Rarity buttons
      const rAll = document.getElementById('f-rarity-all');
      const rCommon = document.getElementById('f-rarity-common');
      const rUncommon = document.getElementById('f-rarity-uncommon');
      const rRare = document.getElementById('f-rarity-rare');

      [rAll, rCommon, rUncommon].forEach(b => {
        b.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help";
      });
      rRare.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-amber-300 border border-amber-500/50 hover:border-amber-400 shrink-0 transition cursor-help";

      if (activeRarity === 'all') {
        rAll.className = "filter-chip px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 text-white border border-slate-700 shrink-0 transition";
      } else if (activeRarity === 'common') {
        rCommon.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
      } else if (activeRarity === 'uncommon') {
        rUncommon.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
      } else if (activeRarity === 'rare') {
        rRare.className = "filter-chip px-2.5 py-1 rounded text-xs font-black bg-amber-500 text-slate-950 border border-amber-400 shrink-0 transition shadow-sm ring-1 ring-amber-400/60";
      }

      // Trait buttons
      const traitLabels = {
        'pale_mantle': 'Pale Gray Mantle',
        'dark_mantle': 'Dark Slate Mantle',
        'black_mantle': 'Jet-Black Mantle',
        'white_mantle': 'White / Frosted',
        'yellow_legs': 'Yellow Legs',
        'pink_legs': 'Pink Legs',
        'red_legs': 'Red/Orange Legs',
        'black_legs': 'Black Legs',
        'bill_ring': 'Black Bill Ring',
        'red_spot': 'Red Gonydeal Spot',
        'black_bill': 'All-Black Bill',
        'two_toned_bill': 'Two-Toned Pink/Black',
        'white_mirrors': 'White Mirrors',
        'white_wingtips': 'White / Frosted (No Black)',
        'ink_wingtips': 'Ink-Dipped (No Mirrors)',
        'white_wedge': 'White Wing Wedge',
        'black_hood': 'Black Hood',
        'ear_spot': 'Dark Ear Spot',
        'tar_collar': 'Black \'Tar Collar\''
      };

      Object.keys(traitLabels).forEach(t => {
        const btn = document.getElementById(`f-${t}`);
        if (!btn) return;
        const base = traitLabels[t];
        if (activeTraits.has(t)) {
          btn.innerHTML = `&#10003; ${base}`;
          btn.className = "filter-chip px-2 py-0.5 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
        } else {
          btn.textContent = base;
          btn.className = "filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help";
        }
      });
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      document.querySelectorAll('.view-btn').forEach(b => {
        b.className = "view-btn px-2 py-0.5 rounded text-[11px] font-medium text-slate-400 hover:text-white";
      });
      const active = document.getElementById(`vm-${mode}`);
      if (active) active.className = "view-btn px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-800 text-white";
      renderFeed();
    }

    function openModal(src, caption) {
      document.getElementById('modalImg').src = src;
      document.getElementById('modalCaption').textContent = caption;
      document.getElementById('imageModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.add('hidden');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Service Worker for offline PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=9').then(reg => {
          reg.update();
        }).catch(() => {});
      });
    }

    // Initial render
    renderFeed();
  </script>
</body>
</html>
