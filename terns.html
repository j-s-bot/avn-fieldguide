<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AVN Fieldguide | Terns & Skimmers Disambiguation Guide</title>

</head>
<body class="min-h-screen flex flex-col selection:bg-sky-500 selection:text-white pb-12 overflow-x-hidden">

  <!-- Instrument Header -->
  <header class="sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-2.5">
    <div class="max-w-6xl mx-auto w-full max-w-full flex items-center justify-between gap-3 overflow-x-auto no-scrollbar">
      
      <!-- Brand & Navigation Switcher -->
      <div class="flex items-center gap-2.5 min-w-0 flex-1">
        <span class="font-black text-sm tracking-tight text-white uppercase">AVN Fieldguide</span>
        
        <!-- Navigation Tabs between Guides -->
        <nav class="flex items-center gap-1.5 ml-2 border-l border-slate-800 pl-2.5 overflow-x-auto no-scrollbar">
          <a href="index.html" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white bg-slate-900 border border-slate-800 hover:border-slate-700 transition" title="Switch to Sparrow Disambiguation Guide">
            Sparrows (11)
          </a>
          <a href="ducks.html" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white bg-slate-900 border border-slate-800 hover:border-slate-700 transition" title="Switch to Waterfowl & Duck Disambiguation Guide">
            Ducks (29)
          </a>
          <a href="gulls.html" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white bg-slate-900 border border-slate-800 hover:border-slate-700 transition" title="Switch to Seagulls & Laridae Disambiguation Guide">
            Gulls (19)
          </a>
          <a href="shorebirds.html" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white bg-slate-900 border border-slate-800 hover:border-slate-700 transition" title="Switch to Shorebirds & Plovers Disambiguation Guide">
            Shorebirds (21)
          </a>
          <span class="px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white shadow-sm ring-1 ring-sky-400/50 transition">
            Terns (16)
          </span>
          <a href="grebes.html" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white bg-slate-900 border border-slate-800 hover:border-slate-700 transition" title="Switch to Grebes & Loons Disambiguation Guide">
            Grebes & Loons (14)
          </a>
        
          <a href="swans.html" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white bg-slate-900 border border-slate-800 hover:border-slate-700 transition" title="Switch to Swans & Lookalikes Disambiguation Guide">
            Swans (14)
          </a>
        </nav>
      </div>

      <!-- Dynamic Results Counter -->
      <div class="flex items-center gap-2 shrink-0 text-xs">
        <button id="unhideBtn" onclick="unhideAll()" class="hidden px-2 py-0.5 rounded text-xs font-semibold bg-rose-950/80 text-rose-300 border border-rose-800/80 hover:bg-rose-900/80 hover:border-rose-600 transition flex items-center gap-1.5 shadow-sm cursor-pointer" title="Restore all dismissed species">
          <span>Unhide All</span>
          <span id="unhideCount" class="bg-rose-900 text-rose-200 px-1 rounded text-[10px] tabular-nums font-bold">0</span>
        </button>
        <span id="matchCounter" class="text-xs font-semibold tabular-nums text-slate-300 px-2 py-0.5 rounded bg-slate-900 border border-slate-800">
          16 variants shown
        </span>
      </div>

    </div>

    <!-- Filter Rail 1: Family / Guild & eBird Rarity -->
    <div class="max-w-6xl mx-auto w-full max-w-full mt-2 flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
      <!-- Family / Guild filters -->
      <button onclick="toggleGroup('all')" id="f-group-all" title="Show all 16 tern & skimmer cards" class="filter-chip px-2.5 py-1 rounded text-xs font-semibold bg-sky-600 text-white shrink-0 transition">All 16</button>
      <button onclick="toggleGroup('typical_sterna')" id="f-group-typical_sterna" title="Typical Sterna: Forster's (breeding & fall), Common (breeding & fall), Roseate, Arctic" class="filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Typical Sterna (6)</button>
      <button onclick="toggleGroup('crested_tern')" id="f-group-crested_tern" title="Large Crested Terns: Royal, Caspian, Sandwich" class="filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Crested Terns (3)</button>
      <button onclick="toggleGroup('marsh_tern')" id="f-group-marsh_tern" title="Marsh Terns: Black Tern (breeding & fall), Gull-billed Tern" class="filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Marsh Terns (3)</button>
      <button onclick="toggleGroup('small_tern')" id="f-group-small_tern" title="Small / Petite Terns: Least Tern" class="filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Small Terns (1)</button>
      <button onclick="toggleGroup('skimmer')" id="f-group-skimmer" title="Skimmers: Black Skimmer (knife bill, water skimming)" class="filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Skimmers (1)</button>
      <button onclick="toggleGroup('pelagic_vagrant')" id="f-group-pelagic_vagrant" title="Pelagic / Storm Vagrants: Sooty Tern, Bridled Tern (tropical hurricane waifs)" class="filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Pelagic Vagrants (2)</button>

      <span class="text-slate-700">|</span>

      <!-- eBird Rarity Tiers -->
      <button onclick="toggleRarity('all')" id="f-rarity-all" title="Show all eBird status levels (Common, Uncommon, and Rare)" class="filter-chip px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 text-white border border-slate-700 shrink-0 transition">All Status</button>
      <button onclick="toggleRarity('common')" id="f-rarity-common" title="eBird Common: Expected coastal/bay breeders and migrants (>30% checklists)" class="filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Common (6)</button>
      <button onclick="toggleRarity('uncommon')" id="f-rarity-uncommon" title="eBird Uncommon: Regular seasonal migrants or local colonies (8% - 28% checklists)" class="filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Uncommon (6)</button>
      <button onclick="toggleRarity('rare')" id="f-rarity-rare" title="eBird Rare / Review Species: Rare review vagrants or pelagic hurricane waifs (<2% checklists)" class="filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-amber-300 border border-amber-500/50 hover:border-amber-400 shrink-0 transition cursor-help">&#9733; Rares (4)</button>

      <div class="ml-auto pl-2 flex items-center gap-2 border-l border-slate-800 shrink-0">
        <!-- Sort Selector -->
        <div class="flex items-center gap-1.5">
          <label for="sortSelect" class="text-[11px] font-bold uppercase tracking-wider text-slate-400 shrink-0">Sort:</label>
          <select id="sortSelect" onchange="setSort(this.value)" class="bg-slate-900 border border-slate-700/80 hover:border-slate-600 text-slate-200 text-xs rounded px-2 py-1 font-medium focus:outline-none focus:ring-1 focus:ring-sky-500 cursor-pointer">
            <option value="freq-desc">Frequency (Most Common)</option>
            <option value="freq-asc">Frequency (Rarest First)</option>
            <option value="size-asc">Size (Smallest &rarr; Largest)</option>
            <option value="size-desc">Size (Largest &rarr; Smallest)</option>
            <option value="bill-asc">Beak (Shortest &rarr; Longest)</option>
            <option value="bill-desc">Beak (Longest &rarr; Shortest)</option>
            <option value="name-asc">Name (A &rarr; Z)</option>
          </select>
        </div>
        <!-- View Mode -->
        <div class="flex items-center gap-1 border-l border-slate-800 pl-2">
          <button onclick="setViewMode('both')" id="vm-both" class="view-btn px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-800 text-white">Both</button>
          <button onclick="setViewMode('plates')" id="vm-plates" class="view-btn px-2 py-0.5 rounded text-[11px] font-medium text-slate-400 hover:text-white">Plates</button>
          <button onclick="setViewMode('photos')" id="vm-photos" class="view-btn px-2 py-0.5 rounded text-[11px] font-medium text-slate-400 hover:text-white">Photos</button>
        </div>
      </div>
    </div>

    <!-- Filter Rail 2: Diagnostic Anatomy (Bill, Head, Wings, Legs) -->
    <div class="max-w-6xl mx-auto w-full max-w-full mt-1.5 flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs">
      <!-- Bill Shape & Color -->
      <span class="text-slate-500 font-semibold uppercase text-[10px] tracking-wider shrink-0">Bill:</span>
      <button onclick="toggleTrait('orange_black_bill')" id="f-orange_black_bill" title="Orange/Red Bill with Black Tip: Forster's Breeding, Common Breeding" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Orange/Red + Black Tip</button>
      <button onclick="toggleTrait('all_black_bill')" id="f-all_black_bill" title="All-Black Bill: Forster's Fall, Common Fall, Black Terns, Gull-billed, Roseate, Sooty, Bridled" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">All-Black Bill</button>
      <button onclick="toggleTrait('carrot_orange_bill')" id="f-carrot_orange_bill" title="Massive Carrot-Orange Bill: Royal Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Carrot-Orange Bill</button>
      <button onclick="toggleTrait('blood_red_bill')" id="f-blood_red_bill" title="Massive or Short Blood-Red Bill: Caspian Tern (huge), Arctic Tern (short all-red)" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Blood-Red Bill</button>
      <button onclick="toggleTrait('yellow_black_bill')" id="f-yellow_black_bill" title="Yellow Bill with Black Tip: Least Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Yellow + Black Tip</button>
      <button onclick="toggleTrait('yellow_tip_bill')" id="f-yellow_tip_bill" title="Black Bill with Yellow Tip: Sandwich Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Yellow-Tipped Black Bill</button>
      <button onclick="toggleTrait('knife_bill')" id="f-knife_bill" title="Laterally-Compressed Knife Bill with Longer Lower Mandible: Black Skimmer" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Knife Bill</button>
      <button onclick="toggleTrait('thick_black_bill')" id="f-thick_black_bill" title="Heavy Thick Stubby Black Bill: Gull-billed Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Thick Gull-Like Bill</button>

      <span class="text-slate-700">|</span>

      <!-- Head Pattern -->
      <span class="text-slate-500 font-semibold uppercase text-[10px] tracking-wider shrink-0">Head:</span>
      <button onclick="toggleTrait('isolated_eye_mask')" id="f-isolated_eye_mask" title="Isolated Black Eye Mask / Comma (Nape stays pure white!): Non-breeding Forster's Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Isolated 'Comma' Mask</button>
      <button onclick="toggleTrait('dark_nape_band')" id="f-dark_nape_band" title="Dark Nape Band Wrapping Completely Behind Head: Non-breeding Common Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Full Nape Band</button>
      <button onclick="toggleTrait('white_forehead')" id="f-white_forehead" title="Extensive White Forehead: Royal Tern, Common Fall" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">White Forehead</button>
      <button onclick="toggleTrait('white_triangle')" id="f-white_triangle" title="White Triangular Forehead Chevron: Least Tern, Sooty Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">White Triangle</button>
      <button onclick="toggleTrait('shaggy_crest')" id="f-shaggy_crest" title="Shaggy Rear Black Crest: Royal Tern, Sandwich Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Shaggy Crest</button>
      <button onclick="toggleTrait('white_collar')" id="f-white_collar" title="White Hindneck Collar & Supercilium: Bridled Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">White Nape Collar</button>

      <span class="text-slate-700">|</span>

      <!-- Crux Marks -->
      <span class="text-slate-500 font-semibold uppercase text-[10px] tracking-wider shrink-0">Crux Marks:</span>
      <button onclick="toggleTrait('pale_primaries')" id="f-pale_primaries" title="Frosty Silvery-White Primaries (Whiter than back): Forster's Tern, Roseate Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Frosty Pale Primaries</button>
      <button onclick="toggleTrait('dark_primaries')" id="f-dark_primaries" title="Dark Grayish Primary Wedge: Common Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Dark Primary Wedge</button>
      <button onclick="toggleTrait('carpal_bar')" id="f-carpal_bar" title="Dark Carpal Shoulder Bar on Leading Edge of Wing: Non-breeding Common Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Dark Carpal Bar</button>
      <button onclick="toggleTrait('dark_underwing_wedge')" id="f-dark_underwing_wedge" title="Solid Dark Grayish-Black Patch on Underside of Outer Primaries: Caspian Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Black Underwing Patch</button>
      <button onclick="toggleTrait('long_streamers')" id="f-long_streamers" title="Extremely Long Tail Streamers Exceeding Folded Wingtips at Rest: Roseate Tern, Arctic Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Long Tail Streamers</button>
      <button onclick="toggleTrait('breast_smudge')" id="f-breast_smudge" title="Dark Vertical Smudge on Side of White Breast at Shoulder: Non-breeding Black Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Breast Smudge</button>
      <button onclick="toggleTrait('black_body')" id="f-black_body" title="All-Dark Soot Body or Jet-Black Upperparts: Black Tern (breeding), Black Skimmer, Sooty Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Black Body / Back</button>

      <span class="text-slate-700">|</span>

      <!-- Legs -->
      <span class="text-slate-500 font-semibold uppercase text-[10px] tracking-wider shrink-0">Legs:</span>
      <button onclick="toggleTrait('orange_red_legs')" id="f-orange_red_legs" title="Bright Orange to Coral-Red Legs: Forster's, Common, Roseate, Arctic, Skimmer" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Orange/Red Legs</button>
      <button onclick="toggleTrait('yellow_legs')" id="f-yellow_legs" title="Bright Yellow Legs: Least Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Yellow Legs</button>
      <button onclick="toggleTrait('black_legs')" id="f-black_legs" title="Black Legs: Royal, Caspian, Sandwich, Gull-billed, Sooty, Bridled" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Black Legs</button>
      <button onclick="toggleTrait('short_legs')" id="f-short_legs" title="Exceptionally Short Legs (stands flat on belly): Arctic Tern" class="filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help">Very Short Legs</button>
    </div>
  </header>

  <!-- Immediate Terns Feed (1 card per row, matching ducks.html, gulls.html, & shorebirds.html) -->
    <!-- Immediate Tern Feed -->
  <div id="urlFilterBannerContainer" class="max-w-6xl mx-auto px-3 sm:px-4 mt-3 max-w-full overflow-hidden hidden">
    <!-- Rendered dynamically -->
  </div>

  <main class="max-w-6xl mx-auto px-3 sm:px-4 mt-4 space-y-5" id="ternFeed">
    <!-- Rendered via JS -->
  </main>

  <!-- FULLSCREEN IMAGE LIGHTBOX MODAL -->
  <div id="imageLightboxModal" class="hidden fixed inset-0 z-[100] bg-black/95 backdrop-blur-md flex flex-col justify-between p-3 sm:p-5" onclick="handleLightboxBackdropClick(event)">
    <!-- Lightbox Header -->
    <div class="flex items-center justify-between gap-3 max-w-6xl w-full mx-auto pb-3 border-b border-slate-800">
      <div class="flex items-center gap-2.5 min-w-0">
        <span class="w-2.5 h-2.5 rounded-full bg-sky-400 shrink-0"></span>
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <h3 id="lightboxTitle" class="text-lg sm:text-xl font-black text-white tracking-tight truncate">Species Name</h3>
            <span id="lightboxBadge" class="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-sky-950 text-sky-300 border border-sky-800">DIAGNOSTIC PLATE</span>
          </div>
          <p id="lightboxSubtitle" class="text-xs italic font-serif text-slate-400 truncate">Scientific Name</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span class="text-[11px] text-slate-500 hidden sm:inline">Press <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono text-[10px]">Esc</kbd> or click outside to close</span>
        <button id="closeLightboxBtn" onclick="closeLightbox()" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition cursor-pointer" title="Close Lightbox (Esc)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
    </div>

    <!-- Lightbox Main Stage Image -->
    <div class="flex-1 flex items-center justify-center p-2 sm:p-4 min-h-0 overflow-hidden">
      <img id="lightboxImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E" alt="Specimen Enlargement" class="max-h-[78vh] max-w-[95vw] sm:max-w-[88vw] object-contain rounded-xl shadow-2xl border border-slate-800 select-none transition-all cursor-zoom-out" onclick="closeLightbox()">
    </div>

    <!-- Lightbox Footer / Diagnostic Notes -->
    <div class="max-w-4xl w-full mx-auto pt-3 border-t border-slate-800/80 text-center">
      <p id="lightboxCaption" class="text-xs sm:text-sm text-slate-300 leading-relaxed font-medium">Diagnostic field mark description</p>
    </div>
  </div>

      const filterParam = params.get('species') || params.get('filter') || params.get('include') || params.get('checklist');
      if (filterParam) {
        const tokens = filterParam.toLowerCase().split(/[\s,|+]+/).map(t => t.trim()).filter(Boolean);
        const matched = new Set();

        tokens.forEach(tok => {
          terns.forEach(t => {
            const idNorm = t.id.toLowerCase();
            const nameNorm = t.name.toLowerCase();
            const sciNorm = t.sci.toLowerCase();
            if (
              idNorm === tok ||
              idNorm.replace(/_/g, '') === tok.replace(/_/g, '') ||
              idNorm.replace(/_/g, '-') === tok ||
              idNorm.startsWith(tok + '_') ||
              idNorm.endsWith('_' + tok) ||
              nameNorm.includes(tok) ||
              sciNorm.includes(tok)
            ) {
              matched.add(t.id);
            }
          });
        });

        if (matched.size > 0) {
          urlSpeciesFilter = matched;
        }
      }
    }

    function updateUrlParams() {
      if (!window.history || !window.history.replaceState) return;
      try {
        const url = new URL(window.location.href);

        if (currentSort && currentSort !== 'freq-desc') {
          url.searchParams.set('sort', currentSort);
        } else {
          url.searchParams.delete('sort');
        }

        if (urlSpeciesFilter && urlSpeciesFilter.size > 0) {
          let paramName = 'species';
          for (const p of ['species', 'filter', 'include', 'checklist']) {
            if (url.searchParams.has(p)) { paramName = p; break; }
          }
          url.searchParams.set(paramName, Array.from(urlSpeciesFilter).join(','));
        } else {
          url.searchParams.delete('species');
          url.searchParams.delete('filter');
          url.searchParams.delete('include');
          url.searchParams.delete('checklist');
        }

        const cleanSearch = url.search ? url.search.replace(/%2C/g, ',') : '';
        const targetUrl = url.pathname + cleanSearch + (url.hash || '');
        window.history.replaceState({}, '', targetUrl);
      } catch (e) {
        console.warn('URL sync notice:', e);
      }
    }

    function clearUrlFilter() {
      urlSpeciesFilter = null;
      updateUrlParams();
      renderFeed();
    }

    function copyCurrentShareLink() {
      updateUrlParams();
      const cleanUrl = window.location.href.replace(/%2C/g, ',');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(cleanUrl).then(() => {
          const btn = document.getElementById('copyShareBtn');
          if (btn) {
            const orig = btn.innerHTML;
            btn.innerHTML = `<span>✓ Copied!</span>`;
            setTimeout(() => { btn.innerHTML = orig; }, 2000);
          }
        }).catch(() => {
          prompt('Share URL:', cleanUrl);
        });
      } else {
        prompt('Share URL:', cleanUrl);
      }
    }

              <div class="h-1.5 w-px bg-white"></div>
            </div>
            <div class="bg-gradient-to-r from-sky-500 via-sky-400 to-cyan-300 h-full rounded-r-sm shadow-[0_0_10px_rgba(56,189,248,0.4)] transition-all" style="width: ${lenPct}%;"></div>
            <span class="absolute right-2 text-[9px] font-mono-num font-bold text-slate-500 uppercase tracking-widest hidden sm:inline">${lenPct}% Category Scale</span>
          </div>
        `;

        container.appendChild(card);
      });

      // Update counter & unhide button
      const counter = document.getElementById('matchCounter');
      const unhideBtn = document.getElementById('unhideBtn');
      const unhideCount = document.getElementById('unhideCount');
      if (counter) {
        if (dismissedCards.size > 0) {
          counter.textContent = `${matches} of ${terns.length} shown (${dismissedCards.size} hidden)`;
          if (unhideBtn) {
            unhideBtn.classList.remove('hidden');
            if (unhideCount) unhideCount.textContent = dismissedCards.size;
          }
        } else {
          counter.textContent = `${matches} of ${terns.length} variants shown`;
          if (unhideBtn) unhideBtn.classList.add('hidden');
        }
      }
    }

    function updateFilterButtons() {
      // Group buttons
      const groupIds = ['all', 'typical_sterna', 'crested_tern', 'marsh_tern', 'small_tern', 'skimmer', 'pelagic_vagrant'];
      groupIds.forEach(g => {
        const btn = document.getElementById(`f-group-${g}`);
        if (!btn) return;
        if (activeGroup === g) {
          btn.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
        } else {
          btn.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help";
        }
      });

      // Rarity buttons
      const rAll = document.getElementById('f-rarity-all');
      const rCommon = document.getElementById('f-rarity-common');
      const rUncommon = document.getElementById('f-rarity-uncommon');
      const rRare = document.getElementById('f-rarity-rare');

      [rAll, rCommon, rUncommon].forEach(b => {
        if (b) b.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help";
      });
      if (rRare) rRare.className = "filter-chip px-2.5 py-1 rounded text-xs font-medium bg-slate-900 text-amber-300 border border-amber-500/50 hover:border-amber-400 shrink-0 transition cursor-help";

      if (activeRarity === 'all') {
        if (rAll) rAll.className = "filter-chip px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 text-white border border-slate-700 shrink-0 transition";
      } else if (activeRarity === 'common') {
        if (rCommon) rCommon.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
      } else if (activeRarity === 'uncommon') {
        if (rUncommon) rUncommon.className = "filter-chip px-2.5 py-1 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
      } else if (activeRarity === 'rare') {
        if (rRare) rRare.className = "filter-chip px-2.5 py-1 rounded text-xs font-black bg-amber-500 text-slate-950 border border-amber-400 shrink-0 transition shadow-sm ring-1 ring-amber-400/60";
      }

      // Trait buttons
      const traitLabels = {
        'orange_black_bill': 'Orange/Red + Black Tip',
        'all_black_bill': 'All-Black Bill',
        'carrot_orange_bill': 'Carrot-Orange Bill',
        'blood_red_bill': 'Blood-Red Bill',
        'yellow_black_bill': 'Yellow + Black Tip',
        'yellow_tip_bill': 'Yellow-Tipped Black Bill',
        'knife_bill': 'Knife Bill',
        'thick_black_bill': 'Thick Gull-Like Bill',
        'isolated_eye_mask': 'Isolated \'Comma\' Mask',
        'dark_nape_band': 'Full Nape Band',
        'white_forehead': 'White Forehead',
        'white_triangle': 'White Triangle',
        'shaggy_crest': 'Shaggy Crest',
        'white_collar': 'White Nape Collar',
        'pale_primaries': 'Frosty Pale Primaries',
        'dark_primaries': 'Dark Primary Wedge',
        'carpal_bar': 'Dark Carpal Bar',
        'dark_underwing_wedge': 'Black Underwing Patch',
        'long_streamers': 'Long Tail Streamers',
        'breast_smudge': 'Breast Smudge',
        'black_body': 'Black Body / Back',
        'orange_red_legs': 'Orange/Red Legs',
        'yellow_legs': 'Yellow Legs',
        'black_legs': 'Black Legs',
        'short_legs': 'Very Short Legs'
      };

      Object.keys(traitLabels).forEach(t => {
        const btn = document.getElementById(`f-${t}`);
        if (!btn) return;
        const base = traitLabels[t];
        if (activeTraits.has(t)) {
          btn.innerHTML = `&#10003; ${base}`;
          btn.className = "filter-chip px-2 py-0.5 rounded text-xs font-bold bg-sky-600 text-white border border-sky-400 shrink-0 transition shadow-sm ring-1 ring-sky-400/50";
        } else {
          btn.textContent = base;
          btn.className = "filter-chip px-2 py-0.5 rounded text-xs font-medium bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 shrink-0 transition cursor-help";
        }
      });
    }

    // Service Worker for offline PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=28').then(reg => {
          reg.update();
        }).catch(() => {});
      });
    }

    initUrlFilter();
    // Initial render
    renderFeed();
  </script>
</body>
</html>
