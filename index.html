<!DOCTYPE html>
<html lang="en" class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500 selection:text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>AVN Fieldguide | Visual Avian Lookalike Eliminator</title>
  <meta name="description" content="Visual avian identification, eBird regional frequency tiers, standardized lateral profile plates, and lookalike species elimination.">
  <meta name="theme-color" content="#030712">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AVN Fieldguide">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #060913;
      color: #f8fafc;
    }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }
    .hotspot-pulse::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 9999px;
      background-color: currentColor;
      animation: pulse-ring 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      z-index: -1;
    }
  </style>
</head>
<body class="min-h-screen pb-32">

  <!-- 1. DYNAMIC TOP SYSTEM & NAVIGATION HEADER -->
  <header id="appHeader"></header>

  <!-- 2. TARGETED CHECKLIST BANNER & DYNAMIC FILTER BAR -->
  <div id="appFilterContainer"></div>

  <!-- 3. MAIN SPECIMEN FEED -->
  <main id="speciesFeed" class="max-w-7xl mx-auto px-3 sm:px-6 mt-4">
    <div class="py-20 text-center text-slate-500 animate-pulse text-sm">
      Loading field guide data...
    </div>
  </main>

  <!-- 4. MODULAR ES BOOTSTRAP -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
